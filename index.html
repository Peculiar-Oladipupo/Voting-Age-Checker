<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#166534">
    <title>Voting Age Checker</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #173b2a;
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .checker-card {
            width: min(100%, 440px);
            padding: 40px;
            border: 1px solid #bbf7d0;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 20px 50px rgb(22 101 52 / 12%);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #15803d;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #14532d;
            font-size: clamp(1.8rem, 6vw, 2.3rem);
            line-height: 1.15;
        }

        .description {
            margin: 12px 0 28px;
            color: #527060;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #244b34;
            font-size: 0.95rem;
            font-weight: 650;
        }

        input {
            width: 100%;
            min-height: 52px;
            padding: 12px 14px;
            border: 1px solid #bbd8c3;
            border-radius: 12px;
            color: #173b2a;
            background: #fbfefc;
            font: inherit;
        }

        input:focus {
            border-color: #16a34a;
            outline: 3px solid rgb(34 197 94 / 20%);
        }

        button {
            width: 100%;
            min-height: 52px;
            margin-top: 16px;
            border: 0;
            border-radius: 12px;
            color: #fff;
            background: #15803d;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 160ms ease, transform 160ms ease;
        }

        button:hover {
            background: #166534;
            transform: translateY(-1px);
        }

        button:focus-visible {
            outline: 3px solid #86efac;
            outline-offset: 3px;
        }

        #display {
            min-height: 52px;
            margin-top: 20px;
            padding: 14px 16px;
            border: 1px solid #dcfce7;
            border-radius: 12px;
            color: #365b43;
            background: #f0fdf4;
            line-height: 1.5;
        }

        #display p {
            margin: 0;
            color: #166534;
            font-weight: 650;
        }

        @media (max-width: 480px) {
            .checker-card {
                padding: 30px 24px;
            }
        }
    </style>
</head>
<body>
    

    <main class="checker-card">
        <p class="eyebrow">Voting age checker</p>
        <h1>Are you eligible to vote?</h1>
        <p class="description">Enter your age below to check your eligibility.</p>

        <label for="input">Your age</label>
        <input type="number" placeholder="e.g. 18" id="input">
        <button type="button" onclick="check()">Check my age</button>
        <div id="display" aria-live="polite">Your result will show here.</div>
    </main>







    <script src="script.js"></script>
</body>
</html>
